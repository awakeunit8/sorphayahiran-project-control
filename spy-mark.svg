<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 643 595" role="img" aria-labelledby="title desc">
<title id="title">ตราสัญลักษณ์บริษัท ศรพญาหิรัญ จำกัด</title>
<desc id="desc">รูปทรงเรขาคณิตสีฟ้าทางซ้ายและน้ำเงินทางขวา อ้างอิงจากภาพโลโก้ความคมชัดสูงที่บริษัทส่งมา</desc>
<defs>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#11bbdf"/>
    <stop offset="1" stop-color="#00b5e3"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1135dd"/>
    <stop offset="1" stop-color="#1611bf"/>
  </linearGradient>
  <clipPath id="left"><path d="M0 0H330V595H0Z"/></clipPath>
  <clipPath id="right"><path d="M330 0H643V595H330Z"/></clipPath>
</defs>
<!-- Roof apex and upper folded segment -->
<path d="M135 290 330 35 330 136 291 220 330 220 330 290Z" fill="url(#cyan)"/>
<path d="M330 35 433 168H330Z" fill="url(#blue)"/>
<!-- S-shaped folded wing, with the horizontal white void left open -->
<path d="M330 220H471L583 366 529 411H330V341H462L423 290H330Z" fill="url(#blue)"/>
<!-- Lower horizontal ribbon and pointed left tip -->
<path d="M97 341H330V411H133L76 367Z" fill="url(#cyan)"/>
<!-- Narrow bevel-edged stripe -->
<g clip-path="url(#left)" fill="url(#cyan)">
  <path d="M194 445H466L478 461 465 476H194L183 461Z"/>
  <path d="M193 506H466V551Q329 620 193 551Z"/>
</g>
<g clip-path="url(#right)" fill="url(#blue)">
  <path d="M194 445H466L478 461 465 476H194L183 461Z"/>
  <path d="M193 506H466V551Q329 620 193 551Z"/>
</g>
</svg>